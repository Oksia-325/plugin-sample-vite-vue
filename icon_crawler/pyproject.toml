[project]
name = "icon-crawler"
version = "0.1.0"
description = "自动同步 Icons8 个人收藏图标的 Python 工具"
requires-python = ">=3.12.12"
dependencies = [
    "aiohttp>=3.9.0",
    "fastapi>=0.128.6",
    "httpx>=0.25.0",
    "jinja2>=3.1.6",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.22",
    "uvicorn>=0.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120  # 代码最大行宽
select = [         # 选择的规则
    "F",
    "E",
    "W",
    "UP",
]
ignore = ["F401"]  # 忽略的规则
